name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
      CC_CLI_BRIDGE: "0"
    defaults:
      run:
        shell: bash
    # Every test step runs even when an earlier one failed (if: success() || failure()), so one run shows all failures.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pytest and tzdata
        # tzdata: Windows has no tz database, and the usage tests read reset times in named zones
        run: python -m pip install --disable-pip-version-check pytest tzdata

      - name: Engine tests (a-d)
        if: success() || failure()
        working-directory: engine
        run: python -m pytest tests/test_[a-d]*.py -q

      - name: Engine tests (e-l)
        if: success() || failure()
        working-directory: engine
        run: python -m pytest tests/test_[e-l]*.py -q

      - name: Engine tests (m-r)
        if: success() || failure()
        working-directory: engine
        run: python -m pytest tests/test_[m-r]*.py -q

      - name: Engine tests (s-z)
        if: success() || failure()
        working-directory: engine
        run: python -m pytest tests/test_[s-z]*.py -q

      - name: Scripts tests
        if: success() || failure()
        run: python -m pytest scripts/tests -q -p no:cacheprovider --ignore=scripts/tests/test_core_install.py

      - name: Scan for personal strings and secrets
        if: success() || failure()
        run: python scripts/export_core.py --scan .

      - name: Clean install test
        if: success() || failure()
        run: python -m pytest scripts/tests/test_core_install.py -q -p no:cacheprovider

  engine-oldest-python:
    # The oldest supported Python: the engine and CLI tests only.
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
      CC_CLI_BRIDGE: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pytest and tzdata
        # tzdata: Windows has no tz database, and the usage tests read reset times in named zones
        run: python -m pip install --disable-pip-version-check pytest tzdata

      - name: Engine tests
        if: success() || failure()
        working-directory: engine
        run: python -m pytest tests -q

      - name: CLI tests
        if: success() || failure()
        run: python -m pytest scripts/tests/test_waypoint_cli.py scripts/tests/test_cli_engine_e2e.py -q -p no:cacheprovider
