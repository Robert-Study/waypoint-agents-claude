<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waypoint Claude</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ==========================================================================
   Waypoint Claude - Linear / Bloomberg Grade Institutional UI
   Anti-slop tokens: Zero atmospheric glows, flat 1-layer depth, hairline borders,
   mandatory tabular numerals, and instantaneous UI transitions.
   ========================================================================== */
:root {
  color-scheme: light;
  --bg: #eef1f4;
  --surface: #fbfcfd;
  --surface-2: #e6eaee;
  --surface-3: #d9e0e7;
  --line: #cfd5dc;
  --line-strong: #9ca6b2;
  --text: #151b22;
  --text-2: #3d4854;
  --text-3: #596572;
  --accent: #0b6b86;
  --accent-bg: #d9eef4;
  --ok: #17703f;
  --ok-bg: #dcf0e4;
  --warn: #8a5a00;
  --warn-bg: #f6e8c8;
  --bad: #b3261e;
  --bad-bg: #f8dedb;
  --mute: #7a8591;
  --focus: #0b6b86;
  --font: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", Consolas, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1217;
    --surface: #151b22;
    --surface-2: #1d252e;
    --surface-3: #26313d;
    --line: #2b3541;
    --line-strong: #3f4e60;
    --text: #e6ebf0;
    --text-2: #b8c2cd;
    --text-3: #92a0ae;
    --accent: #4cc2e0;
    --accent-bg: #123340;
    --ok: #4cc58a;
    --ok-bg: #12301f;
    --warn: #e5b04a;
    --warn-bg: #36290e;
    --bad: #ff7b72;
    --bad-bg: #3d1a18;
    --mute: #6f7c8a;
    --focus: #4cc2e0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1217;
  --surface: #151b22;
  --surface-2: #1d252e;
  --surface-3: #26313d;
  --line: #2b3541;
  --line-strong: #3f4e60;
  --text: #e6ebf0;
  --text-2: #b8c2cd;
  --text-3: #92a0ae;
  --accent: #4cc2e0;
  --accent-bg: #123340;
  --ok: #4cc58a;
  --ok-bg: #12301f;
  --warn: #e5b04a;
  --warn-bg: #36290e;
  --bad: #ff7b72;
  --bad-bg: #3d1a18;
  --mute: #6f7c8a;
  --focus: #4cc2e0;
}


* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 12px/1.35 var(--font);
  font-variant-numeric: tabular-nums;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.sp { flex: 1; }

.pill {
  display: inline-flex; align-items: center; padding: 0 5px; border-radius: 2px;
  font-size: 0.92em; font-weight: 600; line-height: 16px;
  background: var(--surface-2); color: var(--text-2); white-space: nowrap;
}
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.acc { background: var(--accent-bg); color: var(--accent); }
/* The two tags: needs you = quick approval; task = real effort */
.pill.need { background: var(--warn-bg); color: var(--warn); }
.pill.hands { background: transparent; color: var(--text); border: 1px solid var(--line-strong); line-height: 14px; }
button.pill.need { border: 0; cursor: pointer; font: inherit; }
button.pill.need:hover { outline: 1px solid var(--warn); }
.need-node { cursor: pointer; }
.need-node:hover rect.card { stroke: var(--warn); }
#needs-pop { position: fixed; z-index: 50; width: min(420px, calc(100vw - 32px)); max-height: min(70vh, 560px); overflow: auto;
  background: var(--surface); border: 1px solid var(--line-strong); border-top: 3px solid var(--warn); padding: 10px 12px; font-size: 13px; }
#needs-pop[hidden] { display: none; }
#needs-pop .np-h { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; color: var(--text-3); }
#needs-pop .np-h b { color: var(--text); font-weight: 600; }
#needs-pop .np-x { margin-left: auto; background: none; border: 0; color: var(--text-3); cursor: pointer; font-size: 16px; line-height: 1; }
.np-item { border-top: 1px solid var(--line); padding: 8px 0; }
.np-item:first-of-type { border-top: 0; }
.np-where { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.np-prob { margin: 3px 0; line-height: 1.35; color: var(--text); }
.np-res { margin: 3px 0 6px; line-height: 1.35; color: var(--text-2); }
.np-res b { color: var(--ok); font-weight: 600; }
.np-acts { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.np-btn { font: inherit; font-size: 12px; padding: 3px 8px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); cursor: pointer; }
.np-btn:hover { border-color: var(--accent); }
.np-btn.go { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); font-weight: 600; }
.np-btn.no { color: var(--bad); }
.np-btn.rec { border-color: var(--ok); }
.np-reply { display: flex; gap: 4px; }
.np-reply input { flex: 1; min-width: 0; font: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
.chip { font-family: var(--mono); font-size: 0.85em; color: var(--text-3); white-space: nowrap; }

main {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-rows: minmax(0, 1.35fr) minmax(0, 1fr);
  gap: 1px; background: var(--line);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.top-section {
  display: grid;
  grid-template-columns: minmax(240px, 24%) minmax(0, 1fr) minmax(280px, 27%);
  gap: 1px; background: var(--line); min-height: 0;
}
.panel { background: var(--surface); display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; }
.panel > header {
  display: flex; align-items: center; gap: 6px; flex: none; height: 24px; padding: 0 8px;
  border-bottom: 1px solid var(--line); background: var(--surface-2);
}
.panel > header h2 {
  margin: 0; font-size: 0.92em; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--text-2); white-space: nowrap;
}
.meta { color: var(--text-3); font-family: var(--mono); font-size: 0.92em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta.bad { color: var(--bad); }
.panel .body { flex: 1; min-height: 0; overflow-y: auto; position: relative; }

/* Projects */
.project-row {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px;
  padding: 6px 8px; border-bottom: 1px solid var(--line); cursor: pointer;
  border-left: 3px solid transparent;
}
.project-row:hover { background: var(--surface-2); }
.project-row.sel { background: var(--accent-bg); border-left-color: var(--accent); }
.project-row.old { opacity: 0.75; }
.p-head { display: flex; align-items: center; gap: 6px; min-width: 0; }
.p-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-strip { display: flex; flex-wrap: wrap; gap: 2px; margin: 1px 0; }
.p-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 0.92em; color: var(--text-3); }
.p-ver-btn {
  display: inline-flex; align-items: center; gap: 3px; flex: none;
  font-family: var(--mono); font-size: 0.9em; font-weight: 600; color: var(--text-2);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 2px;
  padding: 0 5px; height: 18px; cursor: pointer; line-height: 16px;
}
.p-ver-btn:hover { background: var(--surface-3); border-color: var(--line-strong); color: var(--text); }
.p-ver-btn .arrow { font-size: 0.72em; color: var(--text-3); }
.ver-dropdown { background: var(--surface-2); border: 1px solid var(--line); border-radius: 2px; margin: 2px 0; display: flex; flex-direction: column; }
.ver-opt { display: flex; align-items: center; gap: 6px; padding: 4px 8px; cursor: pointer; font-size: 0.9em; border-bottom: 1px solid var(--line); }
.ver-opt:last-child { border-bottom: 0; }
.ver-opt:hover { background: var(--surface-3); }
.ver-opt.selected { background: var(--accent-bg); box-shadow: inset 2px 0 0 var(--accent); }
.ver-num { font-family: var(--mono); font-weight: 600; color: var(--accent); min-width: 56px; }
.ver-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
.ver-cnt { font-family: var(--mono); color: var(--text-3); font-size: 0.9em; }

.dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--mute); background: transparent; flex: none; }
.dot.done { background: var(--ok); border-color: var(--ok); }
.dot.run { background: var(--accent); border-color: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.dot.bad { background: var(--bad); border-color: var(--bad); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .dot.run, svg.graph .run { animation: none; } }

/* Task graph: left to right, status colours only */
.graphwrap { position: absolute; inset: 0; overflow: auto; }
.graphwrap.fit { display: flex; align-items: center; justify-content: center; overflow: hidden; }
svg.graph { display: block; }
svg.graph .edge { fill: none; stroke: var(--mute); stroke-width: 1; }
svg.graph .arrow { fill: var(--mute); }
svg.graph .card { fill: var(--surface); stroke: var(--line); stroke-width: 1; cursor: default; }
svg.graph text { fill: var(--text); font: 500 11px var(--font); }
svg.graph text.sub { fill: var(--text-3); font: 9.5px var(--mono); }
svg.graph text.tag-need { fill: var(--warn); font: 600 9.5px var(--font); }
svg.graph text.tag-hands { fill: var(--text); font: 600 9.5px var(--font); text-decoration: underline; }
svg.graph .run { animation: pulse 1.2s ease-in-out infinite; }
.graph-legend {
  display: flex; align-items: center; gap: 12px; padding: 3px 8px; font-size: 0.92em; color: var(--text-3);
  border-top: 1px solid var(--line); background: var(--surface-2); flex: none; white-space: nowrap; overflow-x: auto;
}
.graph-legend span { display: inline-flex; align-items: center; gap: 4px; }
.graph-legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }

/* Human to-dos */
.todo-grp-h {
  display: flex; align-items: center; gap: 6px; padding: 3px 8px 2px; background: var(--surface-2);
  font-size: 0.92em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-2);
  border-top: 1px solid var(--line);
}
.todo-grp-h:first-child { border-top: 0; }
.todo-grp-h .cnt { font-family: var(--mono); color: var(--text-3); }
.todo-grp-h .hint { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--text-3); }
.todo-item {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 6px; padding: 4px 8px;
  border-bottom: 1px solid var(--line); align-items: center; border-left: 3px solid transparent;
}
.todo-item.need { border-left-color: var(--warn); }
.todo-item.hands { border-left-color: var(--line-strong); }
.todo-item .txt { min-width: 0; overflow-wrap: anywhere; font-size: 0.95em; line-height: 1.3; }
.todo-item .chip { grid-column: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.todo-item .act { grid-row: 1 / span 2; grid-column: 2; }
.mini-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 2px; padding: 1px 7px;
  cursor: pointer; font-size: 0.9em; font-weight: 600; line-height: 16px;
}
.mini-btn:hover { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
.todo-add-form {
  padding: 6px 8px; border-top: 1px solid var(--line); background: var(--surface-2);
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px; flex: none;
}
.todo-add-form input, .todo-add-form select, .tb-filter {
  border: 1px solid var(--line); background: var(--surface); border-radius: 2px; padding: 2px 6px; font-size: 0.92em;
}
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 2px; padding: 2px 8px;
  cursor: pointer; font-size: 0.92em; font-weight: 600; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.primary:hover, .btn.ok:hover { opacity: 0.92; color: #fff; }
.btn.bad { border-color: var(--bad); color: var(--bad); }
.btn.bad:hover { background: var(--bad-bg); }

/* Bottom hub */
.hub-panel { background: var(--surface); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.hub-tabs {
  display: flex; align-items: center; height: 26px; background: var(--surface-2);
  border-bottom: 1px solid var(--line); padding: 0 8px; gap: 3px; flex: none;
}
.hub-tab {
  border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 2px 10px;
  font-size: 0.92em; font-weight: 600; color: var(--text-3); cursor: pointer; border-radius: 3px 3px 0 0;
  height: 25px; display: inline-flex; align-items: center; gap: 5px;
}
.hub-tab:hover { color: var(--text); }
.hub-tab.active { background: var(--surface); color: var(--text); border-color: var(--line); border-bottom-color: var(--surface); margin-bottom: -1px; }
.badge { font-family: var(--mono); font-size: 0.9em; padding: 0 4px; border-radius: 9px; background: var(--surface-3); color: var(--text-2); line-height: 14px; }
.hub-tab.active .badge { background: var(--accent-bg); color: var(--accent); }
.hub-status { margin-left: auto; font-family: var(--mono); font-size: 0.9em; color: var(--text-3); }
.hub-body { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 10px; }

.pref-card {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 8px 10px;
  border: 1px solid var(--line); border-radius: 3px; background: var(--surface); margin-bottom: 6px;
}
.pref-t { font-weight: 700; overflow-wrap: anywhere; }
.pref-actions { display: flex; gap: 5px; align-items: flex-start; }
.pref-body { grid-column: 1 / -1; color: var(--text-2); font-size: 0.95em; display: grid; gap: 4px; }
.pref-text { display: grid; gap: 4px; cursor: text; border-radius: 2px; padding: 2px 4px; margin: -2px -4px; }
.pref-text:hover { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.pref-body p { margin: 0; overflow-wrap: anywhere; }
.pref-edit { width: 100%; min-height: 90px; resize: vertical; border: 1px solid var(--accent); border-radius: 2px; background: var(--surface); padding: 4px 6px; line-height: 1.4; }
.pref-edit-bar { display: flex; gap: 5px; align-items: center; }
.pref-quote { margin: 0; padding-left: 8px; border-left: 2px solid var(--accent); color: var(--text-3); font-size: 0.92em; font-style: italic; overflow-wrap: anywhere; }
.pref-skill { display: grid; gap: 3px; margin-top: 4px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface-2); }
.pref-skill-h { font-weight: 700; font-size: 0.92em; color: var(--text); }
.pref-skill-t { font-family: var(--mono); font-size: 0.88em; color: var(--text-3); margin-top: 2px; }
.pref-skill-old { text-decoration: line-through; color: var(--text-3); }
.pref-skill-new { color: var(--text); }
.pref-skill-ev { font-size: 0.88em; color: var(--text-3); }
.pref-skill-edit { min-height: 48px; }
.pref-meta { grid-column: 1 / -1; font-family: var(--mono); font-size: 0.88em; color: var(--text-3); }

.tb-bar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 6px; }
.tb-kind { border: 1px solid var(--line); background: var(--surface); border-radius: 2px; padding: 0 6px; cursor: pointer; font-size: 0.9em; line-height: 18px; }
.tb-kind.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.tb-table { width: 100%; border-collapse: collapse; font-size: 0.92em; }
.tb-table th { text-align: left; font-weight: 600; color: var(--text-3); padding: 2px 6px; border-bottom: 1px solid var(--line); background: var(--surface-2); position: sticky; top: -6px; }
.tb-table td { padding: 3px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tb-table td.mono { font-family: var(--mono); font-size: 0.95em; color: var(--text-2); overflow-wrap: anywhere; }
.tb-table tr:hover td { background: var(--surface-2); }

.empty-state { color: var(--text-3); padding: 12px; text-align: center; font-style: italic; }

@media (max-width: 860px) {
  body { overflow: auto; height: auto; }
  main { display: block; }
  .top-section { display: block; }
  .panel { height: 340px; border-bottom: 1px solid var(--line); }
  .hub-panel { min-height: 420px; }
  .tb-table .opt { display: none; }
}
/* v7: the page grows with its content; Projects and the task graph have no inner scroll */
html, body { height: auto; min-height: 100%; }
body { overflow: auto; }
main { display: block; flex: none; }
.panel .body { overflow: visible; flex: none; }
.graphwrap, .graphwrap.fit { position: static; overflow: visible; display: block; text-align: center; }
#b-graph { min-height: 120px; padding: 4px 0; }
.hub-panel { border-top: 1px solid var(--line); }
.sec { border-bottom: 1px solid var(--line); }
.sec-h { width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--surface); border: 0;
  cursor: pointer; font-weight: 700; text-align: left; color: var(--text); }
.sec-h:hover { background: var(--surface-2); }
.sec-h .arrow { width: 10px; color: var(--text-3); }
.sec-h .hint { font-weight: 400; color: var(--text-3); }
.sec-b { padding: 4px 10px 10px; }
.sec-b[hidden] { display: none; }
.sec-b .np-item:first-child { border-top: 0; }
/* ops strip: providers and usage (v8), sprints */
.ops { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.ops > div { background: var(--surface); padding: 6px 10px 8px; min-width: 0; }
.ops h3 { margin: 0 0 6px; font-size: 0.92em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-2);
  display: flex; gap: 6px; align-items: baseline; }
.ops h3 .meta { text-transform: none; letter-spacing: 0; font-weight: 400; }
.ops .line { display: flex; gap: 6px; align-items: baseline; padding: 2px 0; min-width: 0; }
.ops .line .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel-np .np-item { padding: 6px 0; }
.panel-np .np-acts { margin-bottom: 4px; }
.np-msg { font-size: 12px; color: var(--bad); min-height: 0; }
.np-msg:empty { display: none; }
.np-q { margin: 6px 0 2px; color: var(--text); line-height: 1.35; }
.np-q b { font-family: var(--mono); color: var(--text-3); font-weight: 600; margin-right: 4px; }
.np-pick { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 2px; }
.np-pick .np-btn { padding: 2px 7px; }
.np-pick .np-btn.on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.np-pick input { flex: 1; min-width: 0; font: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
@media (max-width: 860px) { .panel { height: auto; } .ops { grid-template-columns: 1fr; } }
/* v8 graph views: Project (dagre), Brain (all tasks) and Knowledge (notes) constellations */
.gv-tabs { display: inline-flex; gap: 0; margin: 0 4px; }
.gv { border: 1px solid var(--line); background: var(--surface); color: var(--text-3); font-size: 0.88em; font-weight: 600; padding: 0 7px; line-height: 16px; cursor: pointer; }
.gv + .gv { border-left: 0; }
.gv:first-child { border-radius: 2px 0 0 2px; } .gv:last-child { border-radius: 0 2px 2px 0; }
.gv.on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
.star-wrap { display: block; line-height: 0; }
canvas.star { display: block; cursor: grab; touch-action: none; }
canvas.star:active { cursor: grabbing; }
#graph-legend { flex-wrap: wrap; row-gap: 2px; }
.star-info { min-height: 22px; padding: 3px 8px; border-top: 1px solid var(--line); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.ln-start { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.ln-start input { flex: 1; min-width: 200px; border: 1px solid var(--line-strong); background: var(--bg); padding: 3px 8px; border-radius: 2px; }
.ln-topic { border-top: 1px solid var(--line); padding: 5px 0; display: grid; gap: 3px; }
.ln-t { display: flex; align-items: baseline; gap: 6px; }
.ln-steps { display: flex; flex-wrap: wrap; gap: 3px; }
.ln-tutor { border: 1px solid var(--line); border-top: 3px solid var(--accent); margin-top: 6px; background: var(--surface); }
.ln-h { display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.ln-log { max-height: 420px; overflow-y: auto; padding: 6px 10px; display: grid; gap: 8px; }
.ln-msg { white-space: pre-wrap; line-height: 1.5; font-size: 13px; max-width: 78ch; }
.ln-msg b { display: block; font-size: 11px; color: var(--text-3); font-weight: 600; margin-bottom: 1px; }
.ln-msg.me { color: var(--text-2); border-left: 2px solid var(--line-strong); padding-left: 8px; }
.ln-form { display: grid; gap: 4px; padding: 6px 10px 8px; border-top: 1px solid var(--line); }
.ln-form textarea { width: 100%; resize: vertical; border: 1px solid var(--line-strong); background: var(--bg); padding: 4px 6px; line-height: 1.4; border-radius: 2px; }
.ln-conf { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; }
.ln-conf .np-btn { padding: 0 7px; } .ln-conf .np-btn.on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.ln-acts { display: flex; gap: 6px; align-items: center; }
.np-explain { margin: 2px 0 4px; color: var(--text-2); font-size: 12px; line-height: 1.4; }
.np-tools { display: flex; gap: 4px; flex-wrap: wrap; margin: 2px 0 4px; }
.np-btn.opt { display: inline-flex; flex-direction: column; align-items: flex-start; text-align: left; max-width: 100%; }
.np-btn.opt small { color: var(--text-3); font-size: 11px; font-weight: 400; line-height: 1.3; margin-top: 1px; white-space: normal; }
.np-btn em { font-style: normal; color: var(--ok); font-size: 11px; font-weight: 600; }
.np-btn.rec { border-color: var(--ok); }
.np-qi { border-left: 2px solid transparent; padding-left: 6px; margin: 4px 0; }
.np-qi.cur { border-left-color: var(--accent); }
.np-qi.done .np-pick, .np-qi.done .np-explain, .np-qi.done .np-qnav { display: none; }
.np-qi.done { opacity: 0.75; cursor: pointer; }
.np-qi:not(.cur):not(.done) .np-pick, .np-qi:not(.cur):not(.done) .np-explain, .np-qi:not(.cur):not(.done) .np-qnav { display: none; }
.np-chosen { margin-left: 6px; color: var(--accent); font-weight: 600; }
.np-qnav { display: flex; gap: 4px; margin-top: 2px; }
.np-btn.skip { color: var(--text-3); }
.todo-item .acts { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 3px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
a.mini-btn { text-decoration: none; color: inherit; display: inline-block; }
.snz { position: relative; display: inline-block; }
.snz-menu { position: absolute; right: 0; top: 20px; z-index: 30; display: flex; flex-direction: column; gap: 2px; padding: 4px; background: var(--surface); border: 1px solid var(--line-strong); white-space: nowrap; }
.snz-menu[hidden] { display: none; }
.snz-line { padding: 4px 8px; }
.star-info:empty::before { content: "Click a dot to see what it is."; color: var(--text-3); }
/* v8: hub status line replaces the intro; providers and usage in one compact list, pools coloured by pace */
.hub-status-bar { display: flex; justify-content: flex-end; padding: 2px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.prov { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; padding: 2px 0; min-width: 0; }
.prov .nm { width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prov.off .nm { color: var(--text-3); }
.pv-btn { flex: none; width: 38px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text-3); font-size: 0.88em; font-weight: 700; line-height: 16px; padding: 0; cursor: pointer; border-radius: 2px; }
.pv-btn.on { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.pv-btn.fail { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.pv-btn:disabled { opacity: 0.6; cursor: wait; }
.pl { display: inline-flex; align-items: baseline; gap: 3px; border: 0; border-left: 3px solid var(--pace-c, var(--line-strong)); background: var(--pace-bg, var(--surface-2));
  padding: 0 5px; font-size: 0.92em; line-height: 16px; cursor: pointer; color: var(--text); border-radius: 0 2px 2px 0; }
.pl b { font-family: var(--mono); font-weight: 600; color: var(--pace-c, var(--text)); }
.pl .fl { font-family: var(--mono); color: var(--text-3); font-size: 0.9em; }
.pl.paced { --pace-c: hsl(var(--h) 72% var(--pace-l)); --pace-bg: hsl(var(--h) 72% var(--pace-l) / 0.13); }
.pl.stale { opacity: 0.6; }
:root { --pace-l: 36%; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pace-l: 62%; } }
:root[data-theme="dark"] { --pace-l: 62%; }
.fl-edit { display: inline-flex; align-items: center; gap: 3px; font-size: 0.9em; color: var(--text-3); }
.fl-edit input { width: 38px; font-family: var(--mono); text-align: right; border: 1px solid var(--accent); background: var(--bg); padding: 0 3px; }
</style>

<body>

<main id="app-main">
  <div class="top-section">
    <section class="panel" id="panel-projects">
      <header>
        <h2>Projects</h2>
        <span class="meta" id="m-projects-count"></span>
        <span class="sp"></span>
        <span class="meta" id="conn" title="Board connection">connecting…</span>
      </header>
      <div class="body" id="b-projects"></div>
    </section>

    <section class="panel" id="panel-graph">
      <header>
        <h2>Task Graph</h2>
        <span class="gv-tabs" role="tablist" aria-label="Graph view"><button type="button" class="gv on" data-gview="project" role="tab">Project</button><button type="button" class="gv" data-gview="brain" role="tab" title="Every task of every live project in one graph">Brain</button><button type="button" class="gv" data-gview="knowledge" role="tab" title="Preferences, notes, skills and instructions">Knowledge</button><button type="button" class="gv" data-gview="learn" role="tab" title="What you learned: claims and the claims they rest on">Learn</button></span>
        <span class="meta" id="m-graph-selected">select a project</span>
      </header>
      <div class="body" id="b-graph"></div>
      <div class="graph-legend" id="graph-legend">
        <span><i style="background:var(--ok);"></i>Done</span>
        <span><i style="background:var(--accent);"></i>Running</span>
        <span><i style="background:var(--bad);"></i>Failed</span>
        <span><i style="border:1.5px solid var(--mute);"></i>Waiting</span>
        <span class="pill need">needs you</span><span>quick yes/no</span>
        <span class="pill hands">task</span><span>your effort</span>
      </div>
    </section>

    <section class="panel" id="panel-todos">
      <header>
        <h2>Approvals:</h2>
        <span class="meta" id="m-todos-count"></span>
      </header>
      <div class="body" id="b-todos"></div>
    </section>
  </div>

  <section class="ops" id="ops" aria-label="Providers and usage, sprints">
    <div><h3>Providers and usage <span class="meta" id="ops-prov-n"></span><span class="sp"></span><span class="meta" id="ops-use-n"></span></h3><div id="ops-prov"></div></div>
    <div><h3>Sprints <span class="meta" id="ops-spr-n"></span></h3><div id="ops-spr"></div></div>
  </section>

  <section class="hub-panel" id="hub">
    <div class="hub-status-bar"><span class="hub-status" id="hub-status-msg">Ready</span></div>
    <div class="sec" data-sec="learn"><button class="sec-h" type="button" data-sec-toggle="learn"><span class="arrow">▸</span>Learn <span class="badge" id="cnt-learn">–</span><span class="hint">measure, plan, teach one step at a time, practise later</span></button><div class="sec-b" id="sec-learn" hidden></div></div>
    <div class="sec" data-sec="prefs"><button class="sec-h" type="button" data-sec-toggle="prefs"><span class="arrow">▸</span>Preference approvals <span class="badge" id="cnt-prefs">–</span><span class="hint">rules captured from your words</span></button><div class="sec-b" id="sec-prefs" hidden></div></div>
    <div class="sec" data-sec="toolbox"><button class="sec-h" type="button" data-sec-toggle="toolbox"><span class="arrow">▸</span>Toolbox approvals <span class="badge" id="cnt-toolbox">–</span><span class="hint">tools, models and subscriptions to confirm</span></button><div class="sec-b" id="sec-toolbox" hidden></div></div>
    <div class="sec" data-sec="audit"><button class="sec-h" type="button" data-sec-toggle="audit"><span class="arrow">▸</span>AI audit approvals <span class="badge" id="cnt-audit">–</span><span class="hint">model and route changes</span></button><div class="sec-b" id="sec-audit" hidden></div></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script>
(function () {
  "use strict";

  var SERVER = "host:waypoint_claude";
  var PREFS = "host:waypoint_claude";
  var REFRESH_MS = 30000;
  var OPS_MS = 20000;  // v8: providers and usage re-read every 20 s (ops_read also starts a usage refresh when readings are old)
  var WATCH = { cache: { staleTime: 30000, gcTime: 300000 }, refetchInterval: REFRESH_MS };

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function label(s) { return String(s || "").replace(/_/g, " "); }
  function payloadOf(ev) { return ev.result && ev.result.payload !== undefined ? ev.result.payload : ev.result; }

  /* ---------- State ---------- */
  var mcp = null;
  var selectedProject = null;
  var openSecs = {};           // bottom sections the viewer opened (all collapsed at load)
  var panelItems = [];
  var liveOps = null, opsNote = "Reading…";
  var lastUpdated = 0;
  var connNote = "connecting…";
  var openVersionDropdown = null;
  var editingPref = null;
  var tbKind = "all", tbQuery = "";

  var liveProjects = null;   // [{id,title,archived,version,version_label,family,subtitle}]
  var liveTodos = [];        // every open to-do, all projects
  var liveNeeds = [];        // every open needs-you question: problem, proposed resolution, options, recommended
  var liveBoards = {};
  var livePrefs = null, prefNote = "Reading preferences…", prefsOff = false;
  var liveToolbox = null, toolboxNote = "Reading toolbox…";
  var watched = {};

  var FINISHED = { done: 1, skipped: 1, carried: 1 };

  /* ---------- Helpers ---------- */
  function ageOf(ms) {
    var s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    return s < 60 ? s + "s" : s < 3600 ? Math.floor(s / 60) + "m" : Math.floor(s / 3600) + "h";
  }
  function statusClass(s) {
    if (FINISHED[s]) return "done";
    if (s === "running") return "run";
    if (s === "error" || s === "failed") return "bad";
    return "wait";
  }
  var STATUS_FILL = { done: "var(--ok)", run: "var(--accent)", bad: "var(--bad)", wait: "var(--mute)" };
  function verLabel(p) { return p.version_range || p.version_label || (p.version != null ? "v" + p.version : p.id); }
  /* Pref 222: show a version only when its family has more than one, or when an exact range (V10.1-V10.2) is set. */
  function verShown(p) {
    if (!p) return "";
    if (p.version_range) return p.version_range;
    var fam = p.family || p.id;
    var n = (liveProjects || []).filter(function (q) { return (q.family || q.id) === fam; }).length;
    return n > 1 ? verLabel(p) : "";
  }

  /* The two tags. needs you: a quick agentic approval (yes/no, pick a model, dispatch).
     task: real effort from you (review a prototype or the final product). */
  function nodeTag(n) {
    if (FINISHED[n.status]) return null;
    var role = String(n.role || "").toLowerCase(), kind = String(n.kind || "").toLowerCase();
    if (role === "human" || role === "owner" || kind === "hands_on") return "hands";
    if (n.status === "needs_you") return "need";
    return null;
  }
  function todoTag(t) { return t.category === "hands_on" ? "hands" : "need"; }

  function getBoard(pid) { return liveBoards[pid] || { project: { id: pid }, nodes: [], todos: [] }; }
  function projectById(pid) { return (liveProjects || []).filter(function (p) { return p.id === pid; })[0]; }

  function getGroupedProjects() {
    var groups = {}, order = [];
    (liveProjects || []).forEach(function (p) {
      var fam = p.family || p.id;
      if (!groups[fam]) { groups[fam] = { familyId: fam, versions: [] }; order.push(fam); }
      groups[fam].versions.push(p);
    });
    var out = order.map(function (fam) {
      var g = groups[fam];
      g.versions.sort(function (a, b) { return (Number(b.version) || 0) - (Number(a.version) || 0); });
      g.active = g.versions.filter(function (v) { return !v.archived; })[0] || null;
      return g;
    });
    // Families with a live version first, then families that are all archived.
    return out.filter(function (g) { return g.active; }).concat(out.filter(function (g) { return !g.active; }));
  }

  function countTags(pid) {
    var b = getBoard(pid), need = 0, hands = 0;
    (b.nodes || []).forEach(function (n) { var t = nodeTag(n); if (t === "need") need++; else if (t === "hands") hands++; });
    (b.todos || []).forEach(function (t) { if (todoTag(t) === "hands") hands++; else need++; });
    return { need: need, hands: hands };
  }

  /* ---------- Projects ---------- */
  function renderProjects() {
    var groups = getGroupedProjects();
    var live = groups.filter(function (g) { return g.active; }).length;
    $("m-projects-count").textContent = live + " active · " + (liveProjects || []).length + " versions";
    if (!groups.length) {
      $("b-projects").innerHTML = '<div class="empty-state">' + (liveProjects ? "No projects on the board." : esc(connNote)) + '</div>';
      return;
    }
    var html = "";
    groups.forEach(function (g) {
      var current = g.versions.filter(function (v) { return v.id === selectedProject; })[0] || g.active || g.versions[0];
      var isSel = current.id === selectedProject;
      var nodes = getBoard(current.id).nodes || [];
      var done = nodes.filter(function (n) { return FINISHED[n.status]; }).length;
      var running = nodes.filter(function (n) { return n.status === "running"; }).length;
      var err = nodes.filter(function (n) { return n.status === "error" || n.status === "failed"; }).length;
      var tags = countTags(current.id);
      var multi = g.versions.length > 1, open = openVersionDropdown === g.familyId;

      var drop = "";
      if (open && multi) {
        drop = '<div class="ver-dropdown">' + g.versions.map(function (v) {
          var vn = getBoard(v.id).nodes || [];
          var vd = vn.filter(function (n) { return FINISHED[n.status]; }).length;
          return '<div class="ver-opt' + (v.id === selectedProject ? ' selected' : '') + '" data-ver-select="' + esc(v.id) + '">' +
            '<span class="ver-num">' + esc(verLabel(v)) + '</span>' +
            '<span class="ver-title">' + esc(v.title || v.id) + '</span>' +
            '<span class="ver-cnt">' + (vn.length ? vd + '/' + vn.length : '') + '</span>' +
            (v.archived ? '<span class="pill">archived</span>' : '<span class="pill ok">active</span>') +
          '</div>';
        }).join('') + '</div>';
      }

      html += '<div class="project-row' + (isSel ? ' sel' : '') + (current.archived ? ' old' : '') + '" data-pid="' + esc(current.id) + '" role="button" tabindex="0">' +
        '<div class="p-head">' +
          '<span class="p-title" title="' + esc(current.title || current.id) + '">' + esc(current.title || current.id) + '</span>' +
          (current.subtitle ? '<span class="chip">' + esc(current.subtitle) + '</span>' : '') +
          '<span class="sp"></span>' +
          (verShown(current) ? '<button class="p-ver-btn" data-ver-toggle="' + esc(g.familyId) + '" type="button" title="' +
            (multi ? g.versions.length + ' versions' : 'one version') + '">' +
            esc(verShown(current)) + (multi ? ' <span class="arrow">▾</span>' : '') + '</button>' : '') +
        '</div>' + drop +
        '<div class="p-strip">' + nodes.map(function (n) {
          return '<i class="dot ' + statusClass(n.status) + '" title="' + esc(n.id + ' ' + (n.title || '') + ' | ' + label(n.status)) + '"></i>';
        }).join('') + '</div>' +
        '<div class="p-meta">' +
          '<span>' + done + '/' + nodes.length + ' done</span>' +
          (running ? '<span class="pill acc">' + running + ' running</span>' : '') +
          (err ? '<span class="pill bad">' + err + ' failed</span>' : '') +
          (tags.need ? '<button type="button" class="pill need" data-needs-pid="' + esc(current.id) + '" title="Show what is waiting and answer it">' + tags.need + ' needs you ▾</button>' : '') +
          (tags.hands ? '<span class="pill hands">' + tags.hands + ' task' + (tags.hands === 1 ? '' : 's') + '</span>' : '') +
          (current.archived ? '<span class="pill">archived</span>' : '') +
        '</div>' +
      '</div>';
    });
    $("b-projects").innerHTML = html;
  }

  /* ---------- Task graph (left to right) ---------- */
  function layoutLR(nodes, edges, CH, CW) {
    var pos = {}, routes = {}, w = 0, h = 0;
    if (window.dagre && window.dagre.graphlib) {
      var g = new window.dagre.graphlib.Graph();
      g.setGraph({ rankdir: "LR", nodesep: 8, ranksep: 22, marginx: 8, marginy: 8 });
      g.setDefaultEdgeLabel(function () { return {}; });
      nodes.forEach(function (n) { g.setNode(n.id, { width: CW, height: CH }); });
      edges.forEach(function (e) { g.setEdge(e[0], e[1]); });
      window.dagre.layout(g);
      nodes.forEach(function (n) { var p = g.node(n.id); pos[n.id] = { x: p.x - CW / 2, y: p.y - CH / 2 }; });
      edges.forEach(function (e) { routes[e[0] + ">" + e[1]] = g.edge(e[0], e[1]).points; });
      w = g.graph().width; h = g.graph().height;
    } else {
      var rank = {}, rows = {};
      nodes.forEach(function (n) { rank[n.id] = 0; });
      for (var i = 0; i < nodes.length; i++) edges.forEach(function (e) { if (rank[e[1]] <= rank[e[0]]) rank[e[1]] = rank[e[0]] + 1; });
      nodes.forEach(function (n) {
        var r = rank[n.id]; rows[r] = (rows[r] || 0) + 1;
        pos[n.id] = { x: 8 + r * (CW + 30), y: 8 + (rows[r] - 1) * (CH + 10) };
        w = Math.max(w, pos[n.id].x + CW + 8); h = Math.max(h, pos[n.id].y + CH + 8);
      });
    }
    return { pos: pos, routes: routes, w: w, h: h };
  }

  var PROJECT_LEGEND = '<span><i style="background:var(--ok);"></i>Done</span>        <span><i style="background:var(--accent);"></i>Running</span>        <span><i style="background:var(--bad);"></i>Failed</span>        <span><i style="border:1.5px solid var(--mute);"></i>Waiting</span>        <span class="pill need">needs you</span><span>quick yes/no</span>        <span class="pill hands">task</span><span>your effort</span>';
  function renderGraph() {
    var box = $("b-graph");
    document.querySelectorAll("[data-gview]").forEach(function (b) { var on = b.getAttribute("data-gview") === graphView; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
    if (graphView !== "project") { renderStar(box, graphView); return; }
    if (!box.querySelector(".graphwrap") && $("graph-legend").innerHTML !== PROJECT_LEGEND) $("graph-legend").innerHTML = PROJECT_LEGEND;
    var b = getBoard(selectedProject), p = projectById(selectedProject) || b.project || {};
    $("m-graph-selected").textContent = selectedProject ? (p.title || selectedProject) + (verShown(p) ? " · " + verShown(p) : "") : "select a project";
    var nodes = b.nodes || [];
    if (!nodes.length) {
      box.innerHTML = '<div class="empty-state">' + (selectedProject ? "No tasks in this version yet." : esc(connNote)) + '</div>';
      return;
    }
    var ids = {}; nodes.forEach(function (n) { ids[n.id] = 1; });
    var edges = [];
    nodes.forEach(function (n) { (n.deps || []).forEach(function (d) { d = typeof d === "string" ? d : d.id; if (ids[d]) edges.push([d, n.id]); }); });

    var CH = 34, CW = 140;
    var L = layoutLR(nodes, edges, CH, CW);
    // no inner scroll: the graph fits the panel width and its height follows
    var W = Math.max(160, box.clientWidth - 4);
    var scale = Math.min(W / L.w, 1.25);
    var fit = true;
    var chars = Math.floor((CW - 14) / 5.8);

    var svg = ['<svg class="graph" viewBox="0 0 ' + Math.ceil(L.w) + ' ' + Math.ceil(L.h) + '" width="' + Math.ceil(L.w * scale) +
      '" height="' + Math.ceil(L.h * scale) + '"><defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path class="arrow" d="M0 0L8 4L0 8z"/></marker></defs>'];
    edges.forEach(function (e) {
      var a = L.pos[e[0]], c = L.pos[e[1]];
      if (!a || !c) return;
      var pts = (L.routes[e[0] + ">" + e[1]] || []).map(function (q) { return { x: q.x, y: q.y }; });
      var s = { x: a.x + CW, y: a.y + CH / 2 }, t = { x: c.x, y: c.y + CH / 2 }, d;
      if (pts.length > 2) {
        pts[0] = s; pts[pts.length - 1] = t;
        d = "M" + pts.map(function (q) { return q.x + " " + q.y; }).join("L");
      } else {
        var mx = (s.x + t.x) / 2;
        d = "M" + s.x + " " + s.y + "C" + mx + " " + s.y + " " + mx + " " + t.y + " " + t.x + " " + t.y;
      }
      svg.push('<path class="edge" d="' + d + '" marker-end="url(#ah)"/>');
    });
    nodes.forEach(function (n) {
      var q = L.pos[n.id], sc = statusClass(n.status), tag = nodeTag(n);
      var title = String(n.title || n.id), shown = title.length > chars ? title.slice(0, chars - 1) + "…" : title;
      var tagText = tag === "need" ? "needs you" : tag === "hands" ? "task" : "";
      var sub = n.id; var room = chars - (tagText ? tagText.length + 2 : 0);

  /* ---------- Ops strip (ops_read): running, usage with floors, providers, sprints ---------- */
  function ago(iso) { var t = Date.parse(iso || ""); return isNaN(t) ? "" : ageOf(t); }
  function until(iso) {
    var t = Date.parse(iso || ""); if (isNaN(t)) return "";
    var s = Math.round((t - Date.now()) / 1000); if (s <= 0) return "reset due";
    return "resets " + (s < 3600 ? Math.ceil(s / 60) + "m" : s < 86400 ? Math.round(s / 3600) + "h" : Math.round(s / 86400) + "d");
  }
  /* Pace against the floor (v8): spending evenly from 100% down to the floor over the pool's window is on pace.
     Returns {hue, word} (no number is shown): green on or under pace, amber slightly over, red far over or at the
     floor; null when the window or reset time is unknown; {stale: true} when the reset time has passed. */
  var PACE_TOL = 0.02, PACE_RED = 0.3;
  function poolWindow(pool) {
    var s = String(pool || "").toLowerCase();
    return /5h/.test(s) ? 5 * 3600e3 : /week|7d/.test(s) ? 7 * 86400e3 : /day|24h/.test(s) ? 86400e3 : null;
  }
  function paceOf(p, now) {
    var win = poolWindow(p.pool), reset = Date.parse(p.resets_at || "");
    if (!win || isNaN(reset)) return null;
    var left = reset - now;
    if (left <= 0) return { stale: true, word: "reset since this reading" };
    var floor = Math.max(0, Math.min(99, Number(p.floor) || 0)), rem = Number(p.remaining_percent) || 0;
    if (rem <= floor) return { hue: 0, word: "at or below the floor" };
    var elapsed = Math.max(0, Math.min(1, 1 - left / win)), spendable = 100 - floor;
    var over = ((100 - rem) - spendable * elapsed) / spendable;  // share of the spendable usage spent ahead of pace
    if (over <= PACE_TOL) return { hue: 135, word: "on or under pace" };
    var sev = Math.min(1, (over - PACE_TOL) / (PACE_RED - PACE_TOL));
    return { hue: Math.round(50 * (1 - sev)), word: sev < 0.34 ? "slightly over pace" : sev < 1 ? "over pace" : "far over pace" };
  }
  window.__wpPace = paceOf;  // for the page test
  var editFloor = null, floorFocus = false;
  function poolShort(pool) {
    var s = String(pool || ""), pre = s.split("_")[0] + "_";
    return (s.indexOf(pre) === 0 && s.length > pre.length ? s.slice(pre.length) : s).replace(/_/g, " ");
  }
  function poolChip(p, now) {
    var pc = Math.max(0, Math.min(100, Number(p.remaining_percent) || 0)), pace = paceOf(p, now);
    var cls = "pl" + (pace && pace.stale ? " stale" : pace ? " paced" : "");
    var tip = p.pool + ": " + pc + "% left" + (p.floor != null ? ", floor " + p.floor + "%" : ", no floor") +
      (pace ? ", " + pace.word : "") + (p.resets_at ? ", " + until(p.resets_at) : "") +
      (p.observed_at ? ", read " + ago(p.observed_at) + " ago" : "") + ". Click to set the floor.";
    if (editFloor === p.pool) {
      return '<label class="fl-edit">' + esc(poolShort(p.pool)) + ' floor<input type="text" inputmode="numeric" data-floor="' + esc(p.pool) +
        '" value="' + (p.floor == null ? '' : esc(p.floor)) + '" placeholder="0" aria-label="Floor for ' + esc(p.pool) + '">%</label>';
    }
    return '<button type="button" class="' + cls + '"' + (pace && !pace.stale ? ' style="--h:' + pace.hue + '"' : '') +
      ' data-edit-floor="' + esc(p.pool) + '" title="' + esc(tip) + '">' + esc(poolShort(p.pool)) + ' <b>' + pc + '%</b>' +
      (p.floor != null ? '<span class="fl">≥' + esc(p.floor) + '</span>' : '') + '</button>';
  }
  function renderOps() {
    if (!liveOps) { ["ops-prov", "ops-spr"].forEach(function (k) { $(k).innerHTML = '<div class="chip">' + esc(opsNote) + '</div>'; }); return; }
    var o = liveOps, now = Date.now(), provBox = $("ops-prov"), pools = o.pools || [];
    var newest = pools.reduce(function (m, p) { var t = Date.parse(p.observed_at || ""); return isNaN(t) ? m : Math.max(m, t); }, 0);
    $("ops-use-n").textContent = o.usage_refreshing ? "refreshing usage…" : newest ? "usage read " + ageOf(newest) + " ago" : "";
    $("ops-use-n").title = "Colour = pace against the floor: green on pace, amber slightly over, red far over. Click a pool to set its floor.";
    if (!(provBox.contains(document.activeElement) && document.activeElement.tagName === "INPUT")) {
      var prov = o.providers || [], seen = {};
      var nFail = prov.filter(function (x) { return x.state === "down"; }).length;
      $("ops-prov-n").textContent = prov.filter(function (x) { return x.enabled; }).length + " on" + (nFail ? " · " + nFail + " fail" : "");

    if ((el = e.target.closest("[data-needs-pid]"))) { openNeeds({ pid: el.getAttribute("data-needs-pid") }, e); return; }
    if ((el = e.target.closest("[data-needs-node]"))) { openNeeds({ pid: selectedProject, nid: el.getAttribute("data-needs-node") }, e); return; }
    if ((el = e.target.closest("[data-needs-legacy]"))) {
      openNeeds({ pid: el.getAttribute("data-needs-legacy"), nid: el.getAttribute("data-nid") }, e); return;
    }
    if ((el = e.target.closest("[data-needs-q]"))) {
      var qid = el.getAttribute("data-needs-q"), qq = allNeeds().filter(function (q) { return q.id === qid; })[0];
      openNeeds({ q: qid, pid: qq && qq.project }, e); return;
    }
    if (!$("needs-pop").hidden) closeNeeds();
    if ((el = e.target.closest("[data-ver-toggle]"))) {
      var fam = el.getAttribute("data-ver-toggle");
      openVersionDropdown = openVersionDropdown === fam ? null : fam;
      renderProjects(); return;
    }
    if ((el = e.target.closest("[data-ver-select]"))) {
      openVersionDropdown = null;
      selectedProject = null;
      selectProject(el.getAttribute("data-ver-select")); return;
    }
    if ((el = e.target.closest("[data-pid]"))) { selectProject(el.getAttribute("data-pid")); return; }
    if (openVersionDropdown) { openVersionDropdown = null; renderProjects(); }

    if ((el = e.target.closest("[data-tick]"))) {
      var input = { id: el.getAttribute("data-tick") }, rev = el.getAttribute("data-rev");
      if (rev) input.expected_rev = Number(rev);
      el.disabled = true;
      call(SERVER, "todo_tick", input, "Done.", refreshBoard); return;
    }
    if ((el = e.target.closest("[data-goto]"))) { selectProject(el.getAttribute("data-goto")); return; }
    if ((el = e.target.closest("[data-gview]"))) {
      graphView = el.getAttribute("data-gview"); starSel = null;
      if (graphView === "knowledge") ensureBrain();
      if (graphView === "learn") ensureLearn();
      if (graphView === "project") $("graph-legend").innerHTML = PROJECT_LEGEND;
      renderGraph(); return;
    }
    if ((el = e.target.closest("[data-goto-graph]"))) { graphView = "project"; $("graph-legend").innerHTML = PROJECT_LEGEND; selectedProject = null; selectProject(el.getAttribute("data-goto-graph")); return; }
    if ((el = e.target.closest("[data-edit-floor]"))) { editFloor = el.getAttribute("data-edit-floor"); floorFocus = true; renderOps(); return; }
    if ((el = e.target.closest("[data-toggle]"))) {
      var on = el.getAttribute("data-on") !== "1";
      el.disabled = true;
      call(SERVER, "toggle_set", { id: el.getAttribute("data-toggle"), enabled: on }, "Switched " + (on ? "on." : "off."), refreshOps);
      return;
    }
    if (e.target.closest("[data-learn-start]")) {
      var tv = ($("ln-topic").value || "").trim();
      if (!tv) { showStatus("Write what you want to understand first."); $("ln-topic").focus(); return; }
      startLearning(slug(tv), tv, "I want to understand: " + tv + ". Start with Measure.");
      return;
    }
    if ((el = e.target.closest("[data-learn-continue]"))) {
      var tid = el.getAttribute("data-learn-continue"), tt = ((liveLearn && liveLearn.topics) || []).filter(function (x) { return x.id === tid; })[0];
      if (tutor.topic === tid) return;
      startLearning(tid, (tt && tt.title) || tid, "Continue this topic from where I am. If claims are due, offer practice first.");
      return;
    }
    if (e.target.closest("[data-learn-practice]")) {
      var d0 = ((liveLearn && liveLearn.due) || [])[0], tp = d0 && ((liveLearn.topics || []).filter(function (x) { return x.id === d0.topic; })[0] || { id: d0.topic });
      if (tp) startLearning(tp.id, tp.title || tp.id, "Practice: pose varied problems for my due claims, one at a time.");
      return;
    }
    if ((el = e.target.closest("[data-ln-conf]"))) {
      el.parentNode.querySelectorAll(".np-btn.on").forEach(function (b) { if (b !== el) b.classList.remove("on"); });
      el.classList.toggle("on"); return;
    }
    if (e.target.closest("[data-learn-send]")) { submitTutor(); return; }
    if (e.target.closest("[data-learn-stop]")) { if (tutor.ctl) tutor.ctl.abort(); return; }
    if (e.target.closest("[data-learn-close]")) { if (tutor.ctl) tutor.ctl.abort(); tutor = { topic: null, title: "", turns: [], busy: false, ctl: null, note: "" }; renderHub(); return; }
    if ((el = e.target.closest("[data-sec-toggle]"))) {
      var k = el.getAttribute("data-sec-toggle");
      openSecs[k] = !openSecs[k];
      if (k === "learn") ensureLearn();
      if (k === "prefs") ensurePrefs();
      if (k === "toolbox") ensureToolbox();
      renderHub(); return;
    }
    if ((el = e.target.closest("[data-open-sec]"))) {
      var k2 = el.getAttribute("data-open-sec");
      openSecs[k2] = true; ensurePrefs(); renderHub();
      $("hub").scrollIntoView({ behavior: "smooth" }); return;
    }
    if ((el = e.target.closest("[data-tb-kind]"))) { tbKind = el.getAttribute("data-tb-kind"); renderHub(); return; }
    if ((el = e.target.closest("[data-pref-act]"))) {
      var id = el.getAttribute("data-id"), act = el.getAttribute("data-pref-act");
      call(PREFS, act === "approve" ? "pref_approve" : "pref_reject", { id: id }, (act === "approve" ? "Approved " : "Rejected ") + id + ".", refreshPrefs);
      return;
    }
    if ((el = e.target.closest("[data-pref-edit]"))) { editingPref = el.getAttribute("data-pref-edit"); renderHub(); return; }
    if (e.target.closest("[data-pref-cancel]")) { editingPref = null; renderHub(); return; }
    if ((el = e.target.closest("[data-pref-save]"))) {
      var pid = el.getAttribute("data-pref-save");
      var paras = $("pref-edit-box").value.split(/\n\s*\n/).map(function (s) { return s.trim(); }).filter(Boolean);
      if (!paras.length) { showStatus("Write at least one paragraph."); return; }
      var editArgs = { id: pid, paragraphs: paras };
      var note = ((livePrefs && livePrefs.pending) || []).filter(function (x) { return x.id === pid; })[0];
      if (note && (note.skill_edits || []).length) {
        editArgs.skill_edits = note.skill_edits.map(function (e, i) {
          var box = document.querySelector('[data-skill-i="' + i + '"]'), copy = Object.assign({}, e);
          if (box && box.value.trim()) copy.text = box.value.trim();
          return copy;
        });
      }
      call(PREFS, "pref_edit", editArgs, "Saved " + pid + ".", function () { editingPref = null; refreshPrefs(); });
    }
  });
  document.addEventListener("keydown", function (e) {
    var row = e.target.closest && e.target.closest("[data-pid]");
    if (row && (e.key === "Enter" || e.key === " ") && e.target === row) { e.preventDefault(); selectProject(row.getAttribute("data-pid")); }
    if (e.key === "Escape" && editingPref) { editingPref = null; renderHub(); }
    if (e.key === "Escape" && editFloor) { var fe = document.activeElement; if (fe && fe.getAttribute && fe.getAttribute("data-floor")) fe.value = fe.defaultValue; editFloor = null; renderOps(); }
    if (e.key === "Escape" && !$("needs-pop").hidden) closeNeeds();
    if (e.key === "Enter" && e.target.getAttribute && e.target.getAttribute("data-floor")) { e.target.blur(); return; }
    if (e.key === "Enter" && e.target.id === "ln-topic") { e.preventDefault(); e.target.blur(); document.querySelector("[data-learn-start]").click(); return; }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && (e.target.id === "ln-answer" || e.target.id === "ln-think")) { e.preventDefault(); submitTutor(); return; }
    if (e.key === "Enter" && e.target.closest && e.target.closest(".np-reply")) {
      e.preventDefault(); sendAnswer(e.target.closest(".np-reply").querySelector("[data-answer]"));
    }
  });
  function refreshOps() {
    if (!mcp) return renderOps();
    Promise.resolve(mcp.invalidate(SERVER, "ops_read")).catch(function () {}).then(renderOps);
  }
  document.addEventListener("change", function (e) {
    var pool = e.target.getAttribute && e.target.getAttribute("data-floor");
    if (!pool || editFloor !== pool) return;  // Escape cancelled the edit
    var v = e.target.value.trim(), n = v === "" ? null : Number(v);
    if (n !== null && !(n >= 0 && n <= 100)) { showStatus("Floor must be 0 to 100, or empty."); return; }
    editFloor = null;
    call(SERVER, "floor_set", { pool: pool, min_percent: n }, "Floor for " + pool + (n == null ? " cleared." : " set to " + n + "%."), function () { e.target.blur(); refreshOps(); });
  });
  document.addEventListener("focusout", function (e) {
    if (!(e.target.getAttribute && e.target.getAttribute("data-floor"))) return;
    setTimeout(function () { if (editFloor && !(document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute("data-floor"))) { editFloor = null; renderOps(); } }, 0);
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "tb-filter") { tbQuery = e.target.value; renderHub(); }
  });
  var rz = 0;
  window.addEventListener("resize", function () { cancelAnimationFrame(rz); rz = requestAnimationFrame(renderGraph); });  // star views re-lay when the width changes

  /* ---------- Live wiring ---------- */
  function watchBoard(pid) {
    if (watched[pid]) return;
    watched[pid] = 1;
    mcp.watchTool(SERVER, "board_read", { project: pid }, function (ev) {
      if (ev.type !== "data") return;
      liveBoards[pid] = payloadOf(ev);
      lastUpdated = Date.now();
      renderAll();
    }, WATCH);
  }

  function boot() {
    if (!(window.claude && typeof window.claude.use === "function")) {
      connNote = "Open this page in the Claude desktop app to see the live board.";
      renderAll(); return;
    }
    var slow = setTimeout(function () { if (!mcp) { connNote = "Still connecting to Waypoint Claude…"; renderAll(); } }, 2500);
    Promise.resolve(window.claude.use("mcp")).then(function (m) {
      clearTimeout(slow);
      if (!m) { connNote = "Board connector unavailable here."; renderAll(); return; }
      mcp = m;
      setTimeout(ensurePrefs, 2500);  // preference count for Approvals, after the board has painted
      setTimeout(ensureLearn, 3500);  // due-practice count on the Learn section
      mcp.watchTool(SERVER, "ops_read", {}, function (ev) {
        if (ev.type === "data") liveOps = payloadOf(ev);
        else if (ev.type === "error" && !liveOps) opsNote = "Unavailable (" + ((ev.error && ev.error.code) || "error") + "). Restart the Claude app so the server offers ops_read.";
        renderOps();
      }, { cache: { staleTime: 15000, gcTime: 300000 }, refetchInterval: OPS_MS });
      mcp.watchTool(SERVER, "board_read", {}, function (ev) {
        if (ev.type === "data") {
          var p = payloadOf(ev) || {};
          liveProjects = p.projects || [];
          liveTodos = p.todos || [];
          liveNeeds = p.needs || [];
          lastUpdated = (ev.result && ev.result.cache && ev.result.cache.storedAt) || Date.now();
          connNote = "Live from Waypoint Claude.";
          if (!selectedProject || !projectById(selectedProject)) {
            var first = getGroupedProjects()[0];
            selectedProject = first ? (first.active || first.versions[0]).id : null;
          }
          liveProjects.forEach(function (proj) { watchBoard(proj.id); });
        } else if (ev.type === "error") {
          var code = (ev.error && ev.error.code) || "error";
          connNote = liveProjects ? "Refresh failed (" + code + "); showing data from " + ageOf(lastUpdated) + " ago."
            : "Board unavailable (" + code + "). Restart the Claude desktop app or allow host:waypoint_claude in Permissions.";
        }
        renderAll();
      }, WATCH);
      renderAll();
    }, function () { clearTimeout(slow); connNote = "Board connector failed to load."; renderAll(); });
  }

  setInterval(renderConn, 15000);
  boot();
})();
</script>
<div id="needs-pop" hidden role="dialog" aria-label="Needs you"></div>
</body>
</html>
